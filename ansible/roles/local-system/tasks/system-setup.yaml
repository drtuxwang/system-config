- name: Ensure "/etc" directory exists
  file:
    path: /etc
    state: directory
    mode: '0755'
  tags:
  - local-system
  - rc-local

- name: Template file to "/etc/hosts"
  template:
    src: hosts
    dest: /etc/hosts
    mode: '0644'
  tags:
  - local-system
  - hosts

- name: Copy file to "/etc/rc.local"
  copy:
    src: '{{ config_directory }}/rc.local'
    dest: /etc/
  tags:
  - local-system
  - rc-local

- name: Template file to "/etc/rc.local-opt"
  template:
    src: rc.local-opt
    dest: /etc/rc.local-opt
    mode: '0755'
  tags:
  - local-system
  - rc-local

- name: Copy file to "/etc/sudoers.d/nopasswd-users"
  when: sudo_commands
  copy:
    src: nopasswd-users
    dest: /etc/sudoers.d/
  tags:
  - local-system
  - sudoers

- name: Template file to "/etc/iptables.conf"
  template:
    src: iptables.conf
    dest: /etc/iptables.conf
    mode: '0755'
  tags:
  - local-system
  - iptables

- name: Copy file to "/etc/polkit-1/rules.d/udisks2-unlock-luks.rules"
  copy:
    src: '{{ config_directory }}/udisks2-unlock-luks.rules'
    dest: /etc/polkit-1/rules.d
  tags:
  - local-system
  - polkit

- name: Copy file to "/etc/default/keyboard"
  copy:
    src: '{{ config_directory }}/keyboard'
    dest: /etc/default/keyboard
  tags:
  - local-system
  - keyboard

- name: Ensure "/etc/NetworkManager" directory exists
  file:
    path: /etc/NetworkManager
    state: directory
    mode: '0755'
  tags:
  - local-system
  - network

- name: Copy file to "/etc/NetworkManager/NetworkManager.conf"
  when: docker_daemon
  copy:
    src: '{{ config_directory }}/NetworkManager.conf'
    dest: '/etc/NetworkManager/NetworkManager.conf'
  tags:
  - local-system
  - network

- name: Ensure "/etc/wireplumber/wireplumber.conf.d" directory exists
  file:
    path: /etc/wireplumber/wireplumber.conf.d
    state: directory
    mode: '0755'
  tags:
  - local-system
  - pipewire

- name: Copy file to "/etc/wireplumber/wireplumber.conf.d/wireplumber.conf"
  copy:
    src: '{{ config_directory }}/wireplumber.conf'
    dest: /etc/wireplumber/wireplumber.conf.d
  tags:
  - local-system
  - pipewire

- name: Ensure "/etc/docker" directory exists
  when: docker_daemon
  file:
    path: /etc/docker
    state: directory
    mode: '0755'
  tags:
  - local-system
  - docker

- name: Copy file to "/etc/docker/daemon.json"
  when: docker_daemon
  copy:
    src: '{{ config_directory }}/daemon.json'
    dest: '/etc/docker/daemon.json'
  tags:
  - local-system
  - docker

- name: Ensure "/opt/software/bin" directory exists
  file:
    path: /opt/software/bin
    state: directory
    mode: '0755'
  tags:
  - local-system
  - software-bin

- name: Synchronize "/opt/software/bin" directory
  ansible.posix.synchronize:
    src: '{{ bin_directory }}/'
    dest: /opt/software/bin/
    owner: no
    group: no
    delete: yes
    rsync_path: sudo rsync
    rsync_opts: --exclude=..fsum --chown=admin:users
  tags:
  - local-system
  - software-bin
